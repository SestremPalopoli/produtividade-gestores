<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores do Gestor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .seletor-data-gestor {
            width: 100%;
            min-width: 190px;
            height: 34px;
            padding: 0 34px 0 12px;
            color: #2e0a5e;
            background: #ffffff;
            border: 1px solid #d9cce9;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 750;
            text-align: center;
            cursor: pointer;
        }

        .seletor-data-gestor:focus {
            outline: none;
            border-color: #7a3fe0;
            box-shadow: 0 0 0 3px rgba(122, 63, 224, 0.15);
        }

        .resumo-periodo .bloco-data-gestor {
            min-width: 265px;
        }
    </style>
</head>
<body class="pagina-gestor">
    <header class="cabecalho cabecalho-gestor">
        <div class="logo">
            <img src="logo-vivo.png" alt="Logo Vivo">
        </div>

        <div class="titulo">
            <h1 id="nomeGestor">Indicadores do Gestor</h1>
            <p id="periodoGestor">Carregando período...</p>
        </div>

        <div class="acoes-gestor">
            <button id="btnFechar" class="btn-voltar" type="button">
                Fechar aba
            </button>
        </div>
    </header>

    <main class="conteudo-gestor">
        <section class="resumo-periodo">
            <div>
                <span>Mês</span>
                <strong id="mesResumo">-</strong>
            </div>

            <div class="bloco-data-gestor">
                <label for="filtroDataGestor">
                    <span>Data selecionada</span>
                </label>
                <select
                    id="filtroDataGestor"
                    class="seletor-data-gestor"
                    aria-label="Selecionar data dos resultados do gestor"
                >
                    <option value="">Carregando...</option>
                </select>
            </div>
        </section>

        <section
            id="gradeGestor"
            class="grade-gestor"
            aria-label="Indicadores individuais"
        ></section>
    </main>

    <div id="mensagemErroGestor" class="mensagem-erro" hidden></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="gestor.js"></script>
</body>
</html>
